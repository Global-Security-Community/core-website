name: Generate Event Page

on:
  repository_dispatch:
    types: [event-created]

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: generate-event-${{ github.event.client_payload.event_slug }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EVENT_ID: ${{ github.event.client_payload.event_id }}
      SLUG: ${{ github.event.client_payload.event_slug }}
      CHAPTER_SLUG: ${{ github.event.client_payload.chapter_slug }}
      PUBLICATION_ID: ${{ github.event.client_payload.publication.id }}
    steps:
      - name: Validate publication request
        run: |
          PUBLICATION_TOKEN=$(jq -r '.client_payload.publication.token // ""' "$GITHUB_EVENT_PATH")
          if ! [[ "$EVENT_ID" =~ ^[a-zA-Z0-9-]{1,128}$ ]] ||
             ! [[ "$SLUG" =~ ^[a-z0-9]([a-z0-9-]{0,78}[a-z0-9])?$ ]] ||
             ! [[ "$CHAPTER_SLUG" =~ ^[a-z0-9][a-z0-9-]{0,60}[a-z0-9]$ ]]; then
            echo "::error::Invalid event publication request"
            exit 1
          fi
          if [ -z "$PUBLICATION_ID" ] && [ -z "$PUBLICATION_TOKEN" ]; then
            echo "::warning::Legacy event dispatch: generating on main only. Release normally until the publication API is deployed."
            echo "TRACK_PUBLICATION=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! [[ "$PUBLICATION_ID" =~ ^[a-f0-9-]{36}$ ]] ||
             ! [[ "$PUBLICATION_TOKEN" =~ ^[0-9]+\.[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid event publication tracking fields"
            exit 1
          fi
          echo "::add-mask::$PUBLICATION_TOKEN"
          echo "PUBLICATION_TOKEN=$PUBLICATION_TOKEN" >> "$GITHUB_ENV"
          echo "TRACK_PUBLICATION=true" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Update main checkout
        run: git pull --ff-only origin main

      - name: Geocode event location
        run: |
          # Look up coordinates from the event location using OpenStreetMap Nominatim
          QUERY=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "${LOCATION}")
          RESPONSE=$(curl -s -H "User-Agent: GSC-EventGenerator/1.0" \
            "https://nominatim.openstreetmap.org/search?q=${QUERY}&format=json&limit=1")

          LATITUDE=$(echo "$RESPONSE" | python3 -c "import sys,json; r=json.load(sys.stdin); print(r[0]['lat'] if r else '')" 2>/dev/null || echo "")
          LONGITUDE=$(echo "$RESPONSE" | python3 -c "import sys,json; r=json.load(sys.stdin); print(r[0]['lon'] if r else '')" 2>/dev/null || echo "")

          if [ -z "$LATITUDE" ] || [ -z "$LONGITUDE" ]; then
            echo "::warning::Could not geocode '${LOCATION}' — coordinates will need to be added manually"
            LATITUDE=""
            LONGITUDE=""
          else
            echo "Geocoded '${LOCATION}' → ${LATITUDE}, ${LONGITUDE}"
          fi

          echo "LATITUDE=${LATITUDE}" >> "$GITHUB_ENV"
          echo "LONGITUDE=${LONGITUDE}" >> "$GITHUB_ENV"
        env:
          LOCATION: ${{ github.event.client_payload.event_location }}

      - name: Generate event page
        env:
          SLUG: ${{ github.event.client_payload.event_slug }}
          TITLE: ${{ github.event.client_payload.event_title }}
          DATE: ${{ github.event.client_payload.event_date }}
          LOCATION: ${{ github.event.client_payload.event_location }}
          DESCRIPTION: ${{ github.event.client_payload.event_description }}
          SESSIONIZE_ID: ${{ github.event.client_payload.event_sessionize_id }}
          REG_CAP: ${{ github.event.client_payload.event_registration_cap }}
          CHAPTER_SLUG: ${{ github.event.client_payload.chapter_slug }}
        run: |
          # Validate slug format (alphanumeric and hyphens only)
          if ! [[ "$SLUG" =~ ^[a-z0-9]([a-z0-9-]{0,78}[a-z0-9])?$ ]]; then
            echo "::error::Invalid event slug format: must be at most 80 lowercase alphanumeric characters and hyphens"
            exit 1
          fi
          if ! [[ "$CHAPTER_SLUG" =~ ^[a-z0-9][a-z0-9-]{0,60}[a-z0-9]$ ]]; then
            echo "::error::Invalid chapter slug format"
            exit 1
          fi

          # Verify resolved path stays within expected directory
          TARGET_DIR="src/events/${SLUG}"
          RESOLVED=$(realpath -m "$TARGET_DIR")
          EXPECTED_PREFIX=$(realpath "src/events")
          if [[ "$RESOLVED" != "$EXPECTED_PREFIX"/* ]]; then
            echo "::error::Path traversal detected in slug"
            exit 1
          fi

          mkdir -p "$TARGET_DIR"

          cat > "${TARGET_DIR}/index.md" << 'FRONTMATTER'
          ---
          layout: event.njk
          FRONTMATTER

          # Use printf to safely write fields that may contain special characters
          # Escape double quotes for valid YAML inline strings
          safe_yaml_inline() { echo "$1" | tr '\n' ' ' | sed 's/  */ /g; s/^ //; s/ $//; s/"/\\"/g'; }
          # Write multi-line description as YAML block scalar (preserves paragraphs)
          {
            printf 'title: "%s"\n' "$(safe_yaml_inline "${TITLE}")"
            printf 'slug: "%s"\n' "${SLUG}"
            printf 'date: "%s"\n' "${DATE}"
            printf 'location: "%s"\n' "$(safe_yaml_inline "${LOCATION}")"
            printf 'description: |\n'
            echo "${DESCRIPTION}" | sed 's/^/  /'
            printf 'sessionizeApiId: "%s"\n' "${SESSIONIZE_ID}"
            printf 'registrationCap: %s\n' "${REG_CAP:-0}"
            printf 'chapterSlug: "%s"\n' "${CHAPTER_SLUG}"
            if [ -n "${LATITUDE}" ] && [ -n "${LONGITUDE}" ]; then
              printf 'latitude: %s\n' "${LATITUDE}"
              printf 'longitude: %s\n' "${LONGITUDE}"
            fi
            echo "---"
          } >> "${TARGET_DIR}/index.md"

          echo "Generated event page at ${TARGET_DIR}/index.md"

      - name: Commit and push
        env:
          EVENT_TITLE: ${{ github.event.client_payload.event_title }}
          EVENT_DATE: ${{ github.event.client_payload.event_date }}
          CHAPTER_SLUG: ${{ github.event.client_payload.chapter_slug }}
          SLUG: ${{ github.event.client_payload.event_slug }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          EVENT_PATH="src/events/${SLUG}/index.md"
          echo "EVENT_PATH=${EVENT_PATH}" >> "$GITHUB_ENV"
          git add "$EVENT_PATH"
          if git diff --cached --quiet; then
            SOURCE_SHA=$(git log -1 --format=%H -- "$EVENT_PATH")
            if ! [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::Unchanged event page has no source commit"
              exit 1
            fi
            echo "Event page already exists on main at ${SOURCE_SHA}"
            echo "SOURCE_SHA=${SOURCE_SHA}" >> "$GITHUB_ENV"
            exit 0
          fi
          BRANCH="auto/event-${SLUG}-${GITHUB_RUN_ID}"
          git checkout -b "${BRANCH}"
          git commit -m "Add event page: ${EVENT_TITLE}

          Event: ${EVENT_TITLE}
          Date: ${EVENT_DATE}
          Chapter: ${CHAPTER_SLUG}

          Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin "${BRANCH}"
          echo "BRANCH=${BRANCH}" >> "$GITHUB_ENV"

      # main is protected and requires the "Build & Test" check to pass. A PR
      # opened with the default GITHUB_TOKEN won't auto-trigger that check
      # (GitHub suppresses recursive triggers from the built-in token), so we
      # kick it off explicitly, then let auto-merge complete once it passes.
      - name: Open PR and wait for merge
        if: env.BRANCH != ''
        env:
          # Org policy blocks the default GITHUB_TOKEN from creating/approving
          # PRs, so this uses a fine-grained PAT scoped to this repo only,
          # with Pull requests: read & write permission (no contents access).
          GH_TOKEN: ${{ secrets.GH_PR_TOKEN }}
          EVENT_TITLE: ${{ github.event.client_payload.event_title }}
        run: |
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "Add event page: ${EVENT_TITLE}" \
            --body "Auto-generated event page.

          Triggered by \`event-created\` repository dispatch."
          PR_NUMBER=$(gh pr view "${BRANCH}" --json number -q .number)

          # The PR-scoped PAT can't dispatch workflow runs, so use the
          # default token (which has Actions access) just for this call.
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh workflow run ci.yml --ref "${BRANCH}"
          gh pr merge "$PR_NUMBER" --auto --squash

          echo "Waiting for PR #$PR_NUMBER to merge..."
          MERGED=false
          for i in $(seq 1 80); do
            STATE=$(gh pr view "$PR_NUMBER" --json state -q .state)
            if [ "$STATE" = "MERGED" ]; then
              echo "✅ PR #$PR_NUMBER merged"
              MERGED=true
              break
            fi
            if [ "$STATE" = "CLOSED" ]; then
              echo "::error::PR #$PR_NUMBER was closed without merging"
              exit 1
            fi
            sleep 15
          done
          if [ "$MERGED" != "true" ]; then
            echo "::error::Timed out waiting for PR #$PR_NUMBER to merge (CI may have failed)"
            exit 1
          fi
          SOURCE_SHA=$(gh pr view "$PR_NUMBER" --json mergeCommit -q .mergeCommit.oid)
          if ! [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Could not resolve the merged event source commit"
            exit 1
          fi
          echo "SOURCE_SHA=${SOURCE_SHA}" >> "$GITHUB_ENV"

      - name: Record generated page
        if: env.TRACK_PUBLICATION == 'true'
        run: |
          PAYLOAD=$(jq -n \
            --arg eventId "$EVENT_ID" \
            --arg chapterSlug "$CHAPTER_SLUG" \
            --arg publicationId "$PUBLICATION_ID" \
            --arg token "$PUBLICATION_TOKEN" \
            --arg runId "$GITHUB_RUN_ID" \
            '{eventId: $eventId, chapterSlug: $chapterSlug, publicationId: $publicationId,
              token: $token, runId: $runId, status: "generated"}')
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 5 --max-time 120 \
            -X POST "https://globalsecurity.community/api/eventPublicationResult" \
            -H "Content-Type: application/json" --data "$PAYLOAD"

      - name: Prepare isolated production release
        if: env.TRACK_PUBLICATION == 'true'
        env:
          EVENT_TITLE: ${{ github.event.client_payload.event_title }}
        run: |
          if ! [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Invalid event source SHA"
            exit 1
          fi

          git fetch origin live-version-swa main
          RELEASE_BRANCH="auto/release-event-${SLUG}-${GITHUB_RUN_ID}"
          git checkout -B "$RELEASE_BRANCH" origin/live-version-swa
          git checkout "$SOURCE_SHA" -- "$EVENT_PATH"
          git add "$EVENT_PATH"

          if git diff --cached --quiet; then
            echo "Event page is already present on the production branch"
            echo "RELEASE_NEEDED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          git commit -m "Release event page: ${EVENT_TITLE}

          Source-main-sha: ${SOURCE_SHA}

          Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
          git push origin "$RELEASE_BRANCH"
          echo "RELEASE_BRANCH=${RELEASE_BRANCH}" >> "$GITHUB_ENV"
          echo "RELEASE_NEEDED=true" >> "$GITHUB_ENV"

      - name: Open protected production pull request
        if: env.RELEASE_NEEDED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PR_TOKEN }}
          EVENT_TITLE: ${{ github.event.client_payload.event_title }}
        run: |
          gh pr create \
            --base live-version-swa \
            --head "$RELEASE_BRANCH" \
            --title "Release event page: ${EVENT_TITLE}" \
            --body "Publishes this event page without including unrelated changes from \`main\`.

          <!-- automated-event-release -->
          <!-- event-slug:${SLUG} -->
          <!-- source-main-sha:${SOURCE_SHA} -->"
          PR_NUMBER=$(gh pr view "$RELEASE_BRANCH" --json number -q .number)
          gh pr merge "$PR_NUMBER" --auto --merge

          MERGED=false
          for i in $(seq 1 80); do
            STATE=$(gh pr view "$PR_NUMBER" --json state -q .state)
            if [ "$STATE" = "MERGED" ]; then
              MERGED=true
              break
            fi
            if [ "$STATE" = "CLOSED" ]; then
              echo "::error::Production PR #$PR_NUMBER was closed without merging"
              exit 1
            fi
            sleep 15
          done
          if [ "$MERGED" != "true" ]; then
            echo "::error::Timed out waiting for production PR #$PR_NUMBER"
            exit 1
          fi
          PRODUCTION_SHA=$(gh pr view "$PR_NUMBER" --json mergeCommit -q .mergeCommit.oid)
          echo "PRODUCTION_SHA=${PRODUCTION_SHA}" >> "$GITHUB_ENV"

      - name: Redeploy an already released event
        if: env.RELEASE_NEEDED == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRODUCTION_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/live-version-swa" --jq .sha)
          echo "PRODUCTION_SHA=${PRODUCTION_SHA}" >> "$GITHUB_ENV"
          echo "DEPLOY_REQUESTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          gh workflow run azure-static-web-apps-lively-desert-0f1f18c10.yml --ref live-version-swa

      - name: Wait for production deployment
        if: env.TRACK_PUBLICATION == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! [[ "$PRODUCTION_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Invalid production SHA"
            exit 1
          fi
          for i in $(seq 1 80); do
            RUNS=$(gh run list \
              --workflow azure-static-web-apps-lively-desert-0f1f18c10.yml \
              --branch live-version-swa \
              --commit "$PRODUCTION_SHA" \
              --limit 10 \
              --json status,conclusion,url,event,createdAt)
            RUN=$(echo "$RUNS" | jq -c --arg since "${DEPLOY_REQUESTED_AT:-}" \
              '[.[] | select((.event == "push" or .event == "workflow_dispatch") and
                .createdAt >= $since)][0] // empty')
            if [ -n "$RUN" ]; then
              STATUS=$(echo "$RUN" | jq -r .status)
              CONCLUSION=$(echo "$RUN" | jq -r '.conclusion // ""')
              if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" = "success" ]; then
                echo "Production deployment completed: $(echo "$RUN" | jq -r .url)"
                exit 0
              fi
              if [ "$STATUS" = "completed" ]; then
                echo "::error::Production deployment concluded with ${CONCLUSION}"
                exit 1
              fi
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for production deployment"
          exit 1

      - name: Verify live event and publish notifications
        if: env.TRACK_PUBLICATION == 'true'
        run: |
          PAYLOAD=$(jq -n \
            --arg eventId "$EVENT_ID" \
            --arg chapterSlug "$CHAPTER_SLUG" \
            --arg publicationId "$PUBLICATION_ID" \
            --arg token "$PUBLICATION_TOKEN" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg productionSha "$PRODUCTION_SHA" \
            '{eventId: $eventId, chapterSlug: $chapterSlug, publicationId: $publicationId,
              token: $token, runId: $runId, productionSha: $productionSha, status: "published"}')
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 10 --max-time 300 \
            -X POST "https://globalsecurity.community/api/eventPublicationResult" \
            -H "Content-Type: application/json" --data "$PAYLOAD"

      - name: Record publication failure
        if: (failure() || cancelled()) && env.TRACK_PUBLICATION == 'true'
        run: |
          PAYLOAD=$(jq -n \
            --arg eventId "$EVENT_ID" \
            --arg chapterSlug "$CHAPTER_SLUG" \
            --arg publicationId "$PUBLICATION_ID" \
            --arg token "$PUBLICATION_TOKEN" \
            --arg runId "$GITHUB_RUN_ID" \
            '{eventId: $eventId, chapterSlug: $chapterSlug, publicationId: $publicationId,
              token: $token, runId: $runId, status: "failed",
              error: "Event generation or production deployment failed. Check the workflow run."}')
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 5 --max-time 120 \
            -X POST "https://globalsecurity.community/api/eventPublicationResult" \
            -H "Content-Type: application/json" --data "$PAYLOAD" ||
            echo "::warning::Could not record publication failure; inspect this workflow run"
