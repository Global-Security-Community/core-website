name: Generate Chapter Page

on:
  repository_dispatch:
    types: [chapter-approved]

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: generate-chapter-${{ github.event.client_payload.chapter_slug }}
  cancel-in-progress: false

jobs:
  generate-chapter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Update main checkout
        run: git pull --ff-only origin main

      - name: Geocode chapter location
        run: |
          # Look up coordinates from city and country using OpenStreetMap Nominatim
          QUERY=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${CITY}, ${COUNTRY}'))")
          RESPONSE=$(curl -s -H "User-Agent: GSC-ChapterGenerator/1.0" \
            "https://nominatim.openstreetmap.org/search?q=${QUERY}&format=json&limit=1")

          LATITUDE=$(echo "$RESPONSE" | python3 -c "import sys,json; r=json.load(sys.stdin); print(r[0]['lat'] if r else '')" 2>/dev/null || echo "")
          LONGITUDE=$(echo "$RESPONSE" | python3 -c "import sys,json; r=json.load(sys.stdin); print(r[0]['lon'] if r else '')" 2>/dev/null || echo "")

          if [ -z "$LATITUDE" ] || [ -z "$LONGITUDE" ]; then
            echo "::warning::Could not geocode ${CITY}, ${COUNTRY} — coordinates will need to be added manually"
            LATITUDE="0"
            LONGITUDE="0"
          else
            echo "Geocoded ${CITY}, ${COUNTRY} → ${LATITUDE}, ${LONGITUDE}"
          fi

          echo "LATITUDE=${LATITUDE}" >> "$GITHUB_ENV"
          echo "LONGITUDE=${LONGITUDE}" >> "$GITHUB_ENV"
        env:
          CITY: ${{ github.event.client_payload.chapter_city }}
          COUNTRY: ${{ github.event.client_payload.chapter_country }}

      - name: Generate chapter page
        env:
          CITY: ${{ github.event.client_payload.chapter_city }}
          COUNTRY: ${{ github.event.client_payload.chapter_country }}
          SLUG: ${{ github.event.client_payload.chapter_slug }}
          LEADS_JSON: ${{ github.event.client_payload.leads }}
          DISCORD_CHANNEL_ID: ${{ github.event.client_payload.discord_channel_id }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          # Validate slug format (alphanumeric and hyphens only)
          if ! [[ "$SLUG" =~ ^[a-z0-9][a-z0-9-]{0,60}[a-z0-9]$ ]]; then
            echo "::error::Invalid chapter slug format: must be lowercase alphanumeric with hyphens"
            exit 1
          fi

          # Verify resolved path stays within expected directory
          TARGET_DIR="src/chapters/${SLUG}"
          RESOLVED=$(realpath -m "$TARGET_DIR")
          EXPECTED_PREFIX=$(realpath "src/chapters")
          if [[ "$RESOLVED" != "$EXPECTED_PREFIX"/* ]]; then
            echo "::error::Path traversal detected in slug"
            exit 1
          fi

          LEAD_NAME=$(echo "${LEADS_JSON}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0].get('name',''))")
          LEAD_HASH=$(echo "${LEADS_JSON}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0].get('email_hash',''))")
          LEAD_LINKEDIN=$(echo "${LEADS_JSON}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0].get('linkedin',''))")
          LEAD_GITHUB=$(echo "${LEADS_JSON}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0].get('github',''))")
          SECOND_LEAD_NAME=$(echo "${LEADS_JSON}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[1].get('name','') if len(d) > 1 else '')")
          SECOND_LEAD_HASH=$(echo "${LEADS_JSON}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[1].get('email_hash','') if len(d) > 1 else '')")
          SECOND_LEAD_LINKEDIN=$(echo "${LEADS_JSON}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[1].get('linkedin','') if len(d) > 1 else '')")
          SECOND_LEAD_GITHUB=$(echo "${LEADS_JSON}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[1].get('github','') if len(d) > 1 else '')")

          mkdir -p "$TARGET_DIR"

          # Build chapter page with proper YAML indentation using printf for safety
          {
            echo "---"
            echo "layout: chapter.njk"
            printf 'title: "Global Security Community %s"\n' "${CITY}"
            printf 'city: "%s"\n' "${CITY}"
            printf 'country: "%s"\n' "${COUNTRY}"
            printf 'latitude: %s\n' "${LATITUDE}"
            printf 'longitude: %s\n' "${LONGITUDE}"
            echo "tags: chapter"
            printf 'discord_channel_id: "%s"\n' "${DISCORD_CHANNEL_ID}"
            printf 'discord_guild_id: "%s"\n' "${DISCORD_GUILD_ID}"
            echo "leads:"
            printf '  - name: "%s"\n' "${LEAD_NAME}"
            printf '    email_hash: "%s"\n' "${LEAD_HASH}"
            if [ -n "${LEAD_GITHUB}" ]; then
              printf '    github: "%s"\n' "${LEAD_GITHUB}"
            fi
            if [ -n "${LEAD_LINKEDIN}" ]; then
              printf '    linkedin: "%s"\n' "${LEAD_LINKEDIN}"
            fi
            if [ -n "${SECOND_LEAD_NAME}" ]; then
              printf '  - name: "%s"\n' "${SECOND_LEAD_NAME}"
              printf '    email_hash: "%s"\n' "${SECOND_LEAD_HASH}"
              if [ -n "${SECOND_LEAD_GITHUB}" ]; then
                printf '    github: "%s"\n' "${SECOND_LEAD_GITHUB}"
              fi
              if [ -n "${SECOND_LEAD_LINKEDIN}" ]; then
                printf '    linkedin: "%s"\n' "${SECOND_LEAD_LINKEDIN}"
              fi
            fi
            echo "---"
          } > "${TARGET_DIR}/index.md"

          echo "Generated chapter page at ${TARGET_DIR}/index.md"

      - name: Commit and push
        env:
          CITY: ${{ github.event.client_payload.chapter_city }}
          SLUG: ${{ github.event.client_payload.chapter_slug }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          CHAPTER_PATH="src/chapters/${SLUG}/index.md"
          echo "CHAPTER_PATH=${CHAPTER_PATH}" >> "$GITHUB_ENV"
          git add "$CHAPTER_PATH"
          if git diff --cached --quiet; then
            SOURCE_SHA=$(git log -1 --format=%H -- "$CHAPTER_PATH")
            if [ -z "$SOURCE_SHA" ]; then
              echo "::error::Chapter page is unchanged but has no source commit"
              exit 1
            fi
            echo "Chapter page already exists on main at ${SOURCE_SHA}"
            echo "SOURCE_SHA=${SOURCE_SHA}" >> "$GITHUB_ENV"
            exit 0
          fi

          BRANCH="auto/chapter-${SLUG}-${GITHUB_RUN_ID}"
          git checkout -b "${BRANCH}"
          git commit -m "Add chapter page for ${CITY}

          Auto-generated from approved chapter application.

          Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin "${BRANCH}"
          echo "BRANCH=${BRANCH}" >> "$GITHUB_ENV"

      # main is protected and requires the "Build & Test" check to pass. A PR
      # opened with the default GITHUB_TOKEN won't auto-trigger that check
      # (GitHub suppresses recursive triggers from the built-in token), so we
      # kick it off explicitly, then let auto-merge complete once it passes.
      - name: Open PR and wait for merge
        if: env.BRANCH != ''
        env:
          # Org policy blocks the default GITHUB_TOKEN from creating/approving
          # PRs, so this uses a fine-grained PAT scoped to this repo only,
          # with Pull requests: read & write permission (no contents access).
          GH_TOKEN: ${{ secrets.GH_PR_TOKEN }}
          CITY: ${{ github.event.client_payload.chapter_city }}
        run: |
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "Add chapter page for ${CITY}" \
            --body "Auto-generated chapter page.

          Triggered by \`chapter-approved\` repository dispatch."
          PR_NUMBER=$(gh pr view "${BRANCH}" --json number -q .number)

          # The PR-scoped PAT can't dispatch workflow runs, so use the
          # default token (which has Actions access) just for this call.
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh workflow run ci.yml --ref "${BRANCH}"
          gh pr merge "$PR_NUMBER" --auto --squash

          echo "Waiting for PR #$PR_NUMBER to merge..."
          MERGED=false
          for i in $(seq 1 40); do
            STATE=$(gh pr view "$PR_NUMBER" --json state -q .state)
            if [ "$STATE" = "MERGED" ]; then
              echo "✅ PR #$PR_NUMBER merged"
              MERGED=true
              break
            fi
            if [ "$STATE" = "CLOSED" ]; then
              echo "::error::PR #$PR_NUMBER was closed without merging"
              exit 1
            fi
            sleep 15
          done
          if [ "$MERGED" != "true" ]; then
            echo "::error::Timed out waiting for PR #$PR_NUMBER to merge (CI may have failed)"
            exit 1
          fi

          SOURCE_SHA=$(gh pr view "$PR_NUMBER" --json mergeCommit -q .mergeCommit.oid)
          if ! [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Could not resolve the merged chapter commit"
            exit 1
          fi
          echo "SOURCE_SHA=${SOURCE_SHA}" >> "$GITHUB_ENV"

      - name: Prepare isolated production release
        env:
          SLUG: ${{ github.event.client_payload.chapter_slug }}
          CITY: ${{ github.event.client_payload.chapter_city }}
        run: |
          if ! [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Invalid chapter source SHA"
            exit 1
          fi

          git fetch origin live-version-swa main
          RELEASE_BRANCH="auto/release-chapter-${SLUG}-${GITHUB_RUN_ID}"
          git checkout -B "$RELEASE_BRANCH" origin/live-version-swa
          git checkout "$SOURCE_SHA" -- "$CHAPTER_PATH"
          git add "$CHAPTER_PATH"

          if git diff --cached --quiet; then
            echo "Chapter page is already present in production"
            echo "RELEASE_NEEDED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          git commit -m "Release chapter page for ${CITY}

          Source-main-sha: ${SOURCE_SHA}

          Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
          git push origin "$RELEASE_BRANCH"
          echo "RELEASE_BRANCH=${RELEASE_BRANCH}" >> "$GITHUB_ENV"
          echo "RELEASE_NEEDED=true" >> "$GITHUB_ENV"

      - name: Open production PR and wait for deployment
        if: env.RELEASE_NEEDED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PR_TOKEN }}
          CITY: ${{ github.event.client_payload.chapter_city }}
          SLUG: ${{ github.event.client_payload.chapter_slug }}
        run: |
          gh pr create \
            --base live-version-swa \
            --head "$RELEASE_BRANCH" \
            --title "Release chapter page for ${CITY}" \
            --body "Automatically publishes the approved **${CITY}** chapter without including unrelated changes from \`main\`.

          <!-- automated-chapter-release -->
          <!-- chapter-slug:${SLUG} -->
          <!-- source-main-sha:${SOURCE_SHA} -->"
          PR_NUMBER=$(gh pr view "$RELEASE_BRANCH" --json number -q .number)
          gh pr merge "$PR_NUMBER" --auto --merge

          echo "Waiting for production PR #$PR_NUMBER to merge..."
          MERGED=false
          for i in $(seq 1 80); do
            STATE=$(gh pr view "$PR_NUMBER" --json state -q .state)
            if [ "$STATE" = "MERGED" ]; then
              MERGED=true
              break
            fi
            if [ "$STATE" = "CLOSED" ]; then
              echo "::error::Production PR #$PR_NUMBER was closed without merging"
              exit 1
            fi
            sleep 15
          done
          if [ "$MERGED" != "true" ]; then
            echo "::error::Timed out waiting for production PR #$PR_NUMBER"
            exit 1
          fi

          PRODUCTION_SHA=$(gh pr view "$PR_NUMBER" --json mergeCommit -q .mergeCommit.oid)
          echo "Production PR merged at ${PRODUCTION_SHA}; waiting for SWA deployment"

          export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          for i in $(seq 1 80); do
            RUN=$(gh run list \
              --workflow azure-static-web-apps-lively-desert-0f1f18c10.yml \
              --commit "$PRODUCTION_SHA" \
              --event push \
              --limit 1 \
              --json status,conclusion,url \
              --jq '.[0] // empty')
            if [ -n "$RUN" ]; then
              STATUS=$(echo "$RUN" | jq -r .status)
              CONCLUSION=$(echo "$RUN" | jq -r '.conclusion // ""')
              if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" = "success" ]; then
                echo "✅ Production deployment completed: $(echo "$RUN" | jq -r .url)"
                exit 0
              fi
              if [ "$STATUS" = "completed" ]; then
                echo "::error::Production deployment concluded with ${CONCLUSION}"
                exit 1
              fi
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for the production deployment"
          exit 1

      - name: Notify Discord of publication
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: ${{ github.event.client_payload.notification_channel_id }}
          CITY: ${{ github.event.client_payload.chapter_city }}
          SLUG: ${{ github.event.client_payload.chapter_slug }}
        run: |
          if [ -z "$BOT_TOKEN" ] || ! [[ "$CHANNEL_ID" =~ ^[0-9]+$ ]]; then
            echo "::warning::Discord publication notification configuration is missing"
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg city "$CITY" \
            --arg url "https://globalsecurity.community/chapters/${SLUG}/" \
            '{
              embeds: [{
                title: "Chapter published",
                description: ("The **" + $city + "** chapter passed all checks and is now live."),
                color: 2142890,
                fields: [{ name: "Chapter page", value: ("[View chapter](" + $url + ")"), inline: false }]
              }]
            }')

          curl --fail-with-body --silent --show-error \
            -X POST "https://discord.com/api/v10/channels/${CHANNEL_ID}/messages" \
            -H "Authorization: Bot ${BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" ||
            echo "::warning::Could not send Discord publication notification"

      - name: Notify Discord of failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: ${{ github.event.client_payload.notification_channel_id }}
          CITY: ${{ github.event.client_payload.chapter_city }}
        run: |
          if [ -z "$BOT_TOKEN" ] || ! [[ "$CHANNEL_ID" =~ ^[0-9]+$ ]]; then
            echo "::warning::Discord failure notification configuration is missing"
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg city "$CITY" \
            --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{
              embeds: [{
                title: "Chapter publication failed",
                description: ("The approved **" + $city + "** chapter needs attention."),
                color: 13382451,
                fields: [{ name: "Workflow", value: ("[View failure](" + $runUrl + ")"), inline: false }]
              }]
            }')

          curl --fail-with-body --silent --show-error \
            -X POST "https://discord.com/api/v10/channels/${CHANNEL_ID}/messages" \
            -H "Authorization: Bot ${BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" ||
            echo "::warning::Could not send Discord failure notification"
