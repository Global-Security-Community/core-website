name: Validate Production Release

on:
  pull_request:
    branches: [live-version-swa]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  validate-source:
    name: Validate Release Source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate production release source
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          TARGET_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$HEAD_REPO" != "$TARGET_REPO" ]; then
            echo "::error::Production releases must originate from ${TARGET_REPO}"
            exit 1
          fi

          if [ "$HEAD_REF" = "main" ]; then
            if ! [[ "$PR_BODY" =~ approved-main-sha:([a-f0-9]{40}) ]]; then
              echo "::error::Production release is missing an approved main SHA"
              exit 1
            fi
            APPROVED_SHA="${BASH_REMATCH[1]}"
            if [ "$HEAD_SHA" != "$APPROVED_SHA" ]; then
              echo "::error::Main changed after approval. Expected $APPROVED_SHA but found $HEAD_SHA"
              exit 1
            fi
            exit 0
          fi

          if [[ "$HEAD_REF" == auto/release-chapter-* ]] &&
             [[ "$PR_BODY" == *"<!-- automated-chapter-release -->"* ]]; then
            SLUG_PATTERN='<!-- chapter-slug:([a-z0-9][a-z0-9-]{0,60}[a-z0-9]) -->'
            PAGE_DIRECTORY="chapters"
          elif [[ "$HEAD_REF" == auto/release-event-* ]] &&
               [[ "$PR_BODY" == *"<!-- automated-event-release -->"* ]]; then
            SLUG_PATTERN='<!-- event-slug:([a-z0-9]([a-z0-9-]{0,78}[a-z0-9])?) -->'
            PAGE_DIRECTORY="events"
          else
            echo "::error::Production releases must come from main or the chapter/event automation"
            exit 1
          fi
          if ! [[ "$PR_BODY" =~ $SLUG_PATTERN ]]; then
            echo "::error::Automated page release has an invalid slug"
            exit 1
          fi
          SLUG="${BASH_REMATCH[1]}"
          SOURCE_PATTERN='<!-- source-main-sha:([a-f0-9]{40}) -->'
          if ! [[ "$PR_BODY" =~ $SOURCE_PATTERN ]]; then
            echo "::error::Automated page release has no valid main source SHA"
            exit 1
          fi
          SOURCE_SHA="${BASH_REMATCH[1]}"
          PAGE_PATH="src/${PAGE_DIRECTORY}/${SLUG}/index.md"

          git fetch origin main
          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "::error::Page source commit is not present on main"
            exit 1
          fi

          CHANGED_FILES=$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --paginate \
            --slurp)
          if ! jq -e --arg path "$PAGE_PATH" \
            'add | length == 1 and .[0].filename == $path and
              (.[0].status == "added" or .[0].status == "modified")' \
            <<< "$CHANGED_FILES" >/dev/null; then
            echo "::error::Automated page releases may add or modify only ${PAGE_PATH}"
            echo "$CHANGED_FILES" | jq -r '.[][] | .filename'
            exit 1
          fi

          git show "${SOURCE_SHA}:${PAGE_PATH}" > /tmp/source-page
          if ! cmp -s /tmp/source-page "$PAGE_PATH"; then
            echo "::error::Production page differs from the approved main source"
            exit 1
          fi
