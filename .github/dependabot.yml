version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action/*"
      codeql-security-updates:
        applies-to: security-updates
        patterns:
          - "github/codeql-action/*"
